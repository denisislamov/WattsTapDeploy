<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WattsTapUnityClient</title>
      <style>
          #invisible-button {
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              background: transparent;
              border: none;
              cursor: pointer;
              z-index: 10;
          }
          #loading-text {
              color: #fff;
              font-family: Arial, sans-serif;
              font-size: 18px;
              text-align: center;
              margin-top: 10px;
          }
          #loading-text .dots::after {
              content: '';
              animation: dots 1.5s steps(4, end) infinite;
          }
          @keyframes dots {
              0% { content: ''; }
              25% { content: '.'; }
              50% { content: '..'; }
              75% { content: '...'; }
              100% { content: ''; }
          }
          #drum-container {
              position: relative;
              width: 100%;
          }
          #drum-container img.drum {
              width: 100%;
              height: auto;
          }
          .bullet {
              position: absolute;
              width: 20%;
              height: auto;
              opacity: 0;
              transition: opacity 0.3s ease-in;
          }
          .bullet.visible {
              opacity: 1;
          }
          .bullet:nth-child(2) { top: 10%; left: 50%; transform: translate(-50%, 0); }
          .bullet:nth-child(3) { top: 25%; left: 80%; transform: translate(-50%, 0); }
          .bullet:nth-child(4) { top: 55%; left: 80%; transform: translate(-50%, 0); }
          .bullet:nth-child(5) { top: 75%; left: 50%; transform: translate(-50%, 0); }
          .bullet:nth-child(6) { top: 55%; left: 20%; transform: translate(-50%, 0); }
          .bullet:nth-child(7) { top: 25%; left: 20%; transform: translate(-50%, 0); }
      </style>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
  </head>
  <body class="dark">
    <button id="invisible-button"></button>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none; background: url('showdown_zone_loading.jpg') center center no-repeat; background-size: contain; background-color: #000;">
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
        <div id="loading-drum" style="position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); width: 20%; max-width: 300px;">
            <div id="drum-container">
                <img src="drum_empty_clean.png" class="drum">
                <img src="bullet_clean.png" class="bullet" id="bullet-1">
                <img src="bullet_clean.png" class="bullet" id="bullet-2">
                <img src="bullet_clean.png" class="bullet" id="bullet-3">
                <img src="bullet_clean.png" class="bullet" id="bullet-4">
                <img src="bullet_clean.png" class="bullet" id="bullet-5">
                <img src="bullet_clean.png" class="bullet" id="bullet-6">
            </div>
            <div id="loading-text">Loading<span class="dots"></span></div>
        </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script>
      const invisibleButton = document.getElementById('invisible-button');
      const hideFullScreenButton = "";
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/1bd36008e6481db32594de0b4ec7272d.loader.js";
      const config = {
        dataUrl: buildUrl + "/4e4626490e2e67d740ca01a609880b34.data",
        frameworkUrl: buildUrl + "/b2f00ae0733986b2ae6b5418da8139fd.framework.js",
        codeUrl: buildUrl + "/cdcb1dc9a9f8c6fe1b7b38d3f1ac78d7.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "WattsTapUnityClient",
        productVersion: "0.1.37",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');

      // Bullet loading animation
      const bullets = document.querySelectorAll('.bullet');
      let currentBullet = 0;
      
      function showNextBullet() {
          if (currentBullet < bullets.length) {
              bullets[currentBullet].classList.add('visible');
              currentBullet++;
          } else {
              // All bullets shown, wait a moment then reset
              setTimeout(() => {
                  bullets.forEach(bullet => bullet.classList.remove('visible'));
                  currentBullet = 0;
              }, 500);
          }
      }
      
      setInterval(showNextBullet, 1000);

      var MyGameInstance = null;

      invisibleButton.addEventListener('click', () => {
          invisibleButton.remove();
          console.log('Overlay button removed');
      });
      
      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          canvas.style.removeProperty('aspect-ratio');
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
          container.className = "unity-mobile";
          canvas.className = "unity-mobile";
      }

      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
              if (window.Telegram && window.TelegramWebviewProxy) {
                  window.Telegram.WebApp.expand();
                  window.TelegramWebviewProxy.postEvent('web_app_request_fullscreen', '');
              }
          }

        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          MyGameInstance = unityInstance;

          MyGameInstance.SendMessage('TelegramService', 'OnCreateUnityInstance');
            
          loadingCover.style.display = "none";

            if (canFullscreen) {
            if (!hideFullScreenButton) {
              fullscreenButton.style.display = "none";
            }
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {

                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                console.log('Access to sensors granted.');
                            } else {
                                console.log('Access to sensors denied.');
                            }
                        })
                        .catch(console.error);
                } else {
                    console.log('DeviceMotionEvent is not supported.');
                }
            }
          }
        }).catch((message) => {
          alert(message);
        });
      };
      
      window.GetTelegramInitDataUnsafeUser = function() {
          var telegramId = '1234567890';
          var telegramUserName = 'TestUser';
          var initData = '';
          
          if (window.Telegram && window.Telegram.WebApp) {
              if (window.Telegram.WebApp.initData) {
                  initData = window.Telegram.WebApp.initData;
                  // alert("initData " + initData); 
                  
                  // Parse initData string to extract user parameter
                  try {
                      var urlParams = new URLSearchParams(initData);
                      var userParam = urlParams.get('user');
                      
                      if (userParam) {
                          // Decode URL-encoded string and parse JSON
                          var userData = JSON.parse(decodeURIComponent(userParam));
                          
                          if (userData.id) {
                              telegramId = userData.id.toString();
                          }
                          if (userData.username) {
                              telegramUserName = userData.username;
                          }
                          
                          // alert("Parsed - telegramId: " + telegramId + ", telegramUserName: " + telegramUserName);
                      } else {
                          // alert("User parameter not found in initData");
                      }
                  } catch (error) {
                      // alert("Error parsing initData: " + error.message);
                  }
              }
          } else {
              // alert("Telegram not found, use default id");
          }

          MyGameInstance.SendMessage('TelegramService', 'ReceiveUserId', telegramId);
          MyGameInstance.SendMessage('TelegramService', 'ReceiveUserName', telegramUserName);
          MyGameInstance.SendMessage('TelegramService', 'ReceiveInitData', initData);
          
          // alert("safeAreaInset" + window.Telegram.WebApp.safeAreaInset);
          var safeAreaToString = window.Telegram.WebApp.safeAreaInset.top.toString() + ',' +
                                 window.Telegram.WebApp.safeAreaInset.left.toString() + ',' +
                                 window.Telegram.WebApp.safeAreaInset.bottom.toString() + ',' +
                                 window.Telegram.WebApp.safeAreaInset.right.toString();
          // alert("SafeAreaInsets string : " + safeAreaToString);
          MyGameInstance.SendMessage('TelegramService', 'ReceiveSafeAreaInsets', safeAreaToString);
      }

      window.TriggerHapticFeedback = function() {
          if (window.Telegram && window.Telegram.WebApp) {
              window.Telegram.WebApp.HapticFeedback.impactOccurred("medium");
              // if (type === 'impact') {
              //     // For impact type, you might want to specify an impact style
              //     window.Telegram.WebApp.web_app_trigger_haptic_feedback(type, 'medium');
              // } else {
              //     window.Telegram.WebApp.web_app_trigger_haptic_feedback(type);
              // }
          } else {
              console.warn("Telegram WebApp object not found. Haptic feedback not available.");
              // alert("Haptic feedback is only available within a Telegram Mini App.");
          }
      }
      
      document.body.appendChild(script);
    </script>
  </body>
</html>
